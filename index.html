<html>
<head>
  <title>3D Platformer</title>
  <style>
    body { 
      margin: 0; 
      overflow: hidden;
      background: #000;
    }
    canvas { 
      width: 100%; 
      height: 100%; 
      display: block; 
    }
    #instructions {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 5px;
      font-family: Arial, sans-serif;
    }
    #switchButton {
      margin-top: 10px;
      padding: 5px 10px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="instructions">
    Current Controls:<br>
    WASD to move active player<br>
    SPACE to jump<br>
    TAB or the button below to switch between players<br>
    <br>
    Green Player is tall, Orange Player is short
    <br>
    <button id="switchButton">Switch Player</button>
  </div>
  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.153.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="game.js"></script>
  <script>
    // Wire up the switch button to call switchPlayer on our game instance
    window.addEventListener('DOMContentLoaded', () => {
      const switchButton = document.getElementById('switchButton');
      switchButton.addEventListener('click', () => {
        if (window.game && window.game.switchPlayer) {
          window.game.switchPlayer();
        }
      });
    });
  </script>

</body>
</html>
